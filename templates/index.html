<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sailor's Logbook</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div id="sidebar-header">
    <div class="compass-rose">⚓</div>
    <h1>Sailor's<br/>Logbook</h1>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar">
    <div class="stat">
      <span class="stat-val" id="stat-voyages">–</span>
      <span class="stat-lbl">Voyages</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="stat-nm">–</span>
      <span class="stat-lbl">Nautical Miles</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="stat-hours">–</span>
      <span class="stat-lbl">Hours at Sea</span>
    </div>
  </div>

  <button id="btn-new" onclick="openForm()">+ Log New Voyage</button>

  <!-- Voyage list -->
  <div id="voyage-list-wrap">
    <h2 class="section-title">Voyage Log</h2>
    <div id="voyage-list">
      <div class="empty-state">No voyages yet.<br/>Log your first passage!</div>
    </div>
  </div>
</aside>

<!-- ── MAP ──────────────────────────────────────────────────────── -->
<main id="map-wrap">
  <div id="map"></div>

  <!-- Voyage detail panel (slides in from right) -->
  <div id="detail-panel" class="hidden">
    <button id="detail-close" onclick="closeDetail()">✕</button>
    <div id="detail-content"></div>
  </div>
</main>

<!-- ── NEW VOYAGE MODAL ─────────────────────────────────────────── -->
<div id="modal-overlay" class="hidden" onclick="closeForm(event)">
  <div id="modal">
    <h2>Log a Voyage</h2>
    <button class="modal-close" onclick="closeForm()">✕</button>

    <div class="form-grid">
      <label>Title *
        <input id="f-title" type="text" placeholder="Baltic Circuit 2025" required />
      </label>
      <label>Date *
        <input id="f-date" type="date" required />
      </label>
      <label>Boat
        <input id="f-boat" type="text" placeholder="SY Albatross" />
      </label>
      <label>Crew
        <input id="f-crew" type="text" placeholder="Names…" />
      </label>
      <label>From
        <input id="f-start" type="text" placeholder="Departure port" />
      </label>
      <label>To
        <input id="f-end" type="text" placeholder="Arrival port" />
      </label>
      <label>Distance (NM) <span class="hint">auto-filled from GPX</span>
        <input id="f-nm" type="number" step="0.1" min="0" placeholder="0" />
      </label>
      <label>Duration (hours) <span class="hint">auto-filled from GPX</span>
        <input id="f-hours" type="number" step="0.1" min="0" placeholder="0" />
      </label>
    </div>

    <label class="full-width">GPX Track
      <div id="gpx-drop" onclick="document.getElementById('f-gpx').click()">
        <span id="gpx-drop-text">📂 Click or drag & drop a .gpx file</span>
        <input id="f-gpx" type="file" accept=".gpx" style="display:none" onchange="handleGpxSelect(this)" />
      </div>
    </label>

    <label class="full-width">Notes
      <textarea id="f-notes" rows="3" placeholder="Weather, highlights, memorable moments…"></textarea>
    </label>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeForm()">Cancel</button>
      <button class="btn-save" onclick="submitVoyage()">Save Voyage</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
